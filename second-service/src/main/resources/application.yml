server:
  port: 8082

spring:
  application:
    name: my-second-service # Eureka에 등록되는 서비스 이름

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.instance_id:${random.value}}

